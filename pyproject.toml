[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-fix-lab"
version = "0.1.0"
description = "Vulnerability reproduction and remediation demonstrations with automated tests."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Muhammad Hamid", email = "mhamidlad@users.noreply.github.com"},
]
keywords = ["security", "vulnerability", "remediation", "fix-lab", "owasp", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pytest>=7.0",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/mhamidlad/ai-security-fix-lab"
Issues = "https://github.com/mhamidlad/ai-security-fix-lab/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
